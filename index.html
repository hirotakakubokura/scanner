<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>都筑キッズデンタルランド 受付スキャナー</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root { --main-color:#FFB100; --sky-blue:#4FC3F7; --bg-color:#FFF9E1; --text-color:#5D4037; --accent-orange:#FF6F00; }
    html,body { height:100%; margin:0; padding:0; background:var(--bg-color); color:var(--text-color); font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',sans-serif; -webkit-text-size-adjust:100%; overscroll-behavior:none; }
    body { display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; overflow:hidden; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
    .header { background-color:var(--sky-blue); color:white; padding:14px 12px; font-weight:900; font-size:1.35em; border-bottom:5px solid var(--main-color); text-align:center; flex:0 0 auto; user-select:none; }
    .main { flex:1 1 auto; display:flex; flex-direction:column; min-height:0; align-items:center; }
    #video-container { position:relative; width:100%; max-width:980px; margin:0 auto; height:58svh; height:58dvh; background:#000; overflow:hidden; flex:0 0 auto; }
    #canvas { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
    .guide-box { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:min(250px,65vw); height:min(250px,65vw); border:6px solid var(--main-color); border-radius:30px; box-shadow:0 0 0 1000px rgba(0,0,0,0.4); pointer-events:none; }
    .status-msg { font-size:1.35em; font-weight:900; padding:12px 12px 6px; margin:0; text-align:center; flex:0 0 auto; user-select:none; }
    .actions { width:100%; display:flex; justify-content:center; padding:10px 12px 14px; box-sizing:border-box; flex:0 0 auto; gap:10px; flex-wrap:wrap; }
    .big-btn { background:var(--sky-blue); color:white; border:none; padding:14px 22px; font-size:1.15em; border-radius:12px; cursor:pointer; font-weight:900; box-shadow:0 6px 16px rgba(0,0,0,0.18); user-select:none; }
    .big-btn:active { transform:translateY(1px); }
    #camera-gate { position:fixed; inset:0; background:rgba(0,0,0,0.65); display:none; z-index:12000; align-items:center; justify-content:center; padding:18px; box-sizing:border-box; }
    .gate-card { width:min(560px,92vw); background:white; border-radius:20px; padding:22px; text-align:center; }
    .gate-card h3 { margin:0 0 10px; font-size:1.5em; font-weight:900; color:#333; }
    .gate-card p { margin:0 0 14px; font-size:1.05em; font-weight:800; color:#666; line-height:1.4; }
    #camera-gate-btn { background:var(--accent-orange); color:#fff; border:none; padding:20px 22px; border-radius:18px; font-size:1.4em; font-weight:900; cursor:pointer; width:100%; box-shadow:0 8px 0 #E65100; min-height:64px; touch-action:manipulation; }
    #camera-gate-btn:active { transform:translateY(4px); box-shadow:0 4px 0 #E65100; }
    video { -webkit-transform:translateZ(0); }
  </style>
</head>
<body>
  <div class="header">👑　都筑キッズデンタルランド受付　👑</div>
  <div class="main">
    <div id="video-container">
      <canvas id="canvas"></canvas>
      <div class="guide-box"></div>
    </div>
    <p class="status-msg" id="status-msg">診察券（QR）をみせてね🐾</p>
    <div class="actions">
      <button class="big-btn" onclick="goToSearch()">📱 スマホを忘れた方はこちら</button>
    </div>
  </div>
  <div id="camera-gate">
    <div class="gate-card">
      <h3>カメラを起動します</h3>
      <p>ボタンを押してカメラを起動してください。</p>
      <button id="camera-gate-btn" type="button">📷 カメラを起動する</button>
    </div>
  </div>
  <video id="qr-video" autoplay playsinline muted style="position:absolute; left:-9999px; top:-9999px; width:1px; height:1px;"></video>
  <script>
    const GAS_SCANNER_URL = "https://script.google.com/macros/s/AKfycbz3LgHl80x5jiZrabVYNFSbRnwSE3O_gYJrtvEtBOezzk7uPUTNWgsfPMBOedO31ioDmA/exec?mode=scanner";

    function goToScanner(payload) {
      window.location.href = GAS_SCANNER_URL + "&qr=" + encodeURIComponent(payload);
    }
    function goToSearch() {
      window.location.href = GAS_SCANNER_URL + "&search=1";
    }

    const qrVideoEl    = document.getElementById("qr-video");
    const canvas       = document.getElementById("canvas");
    const ctx          = canvas.getContext("2d", { willReadFrequently: true });
    const statusMsg    = document.getElementById("status-msg");
    const cameraGate   = document.getElementById("camera-gate");
    const cameraGateBtn = document.getElementById("camera-gate-btn");

    let isScanning = true;
    let lastPayload = "";
    let lastScanAt = 0;
    const SCAN_COOLDOWN_MS = 1200;
    let qrStream = null;
    let qrStarting = false;
    let lastFrameAt = 0;
    let frameWatchTimer = null;

    async function startQrCamera(reason) {
      if (qrStarting) return;
      qrStarting = true;
      try {
        if (qrStream && qrStream.active && qrStream.getTracks().some(t => t.readyState === "live")) {
          isScanning = true; beginFrameWatch(); qrStarting = false; return;
        }
        stopQrCamera(false);
        const stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:"user", width:{ ideal:1280 }, height:{ ideal:720 } } });
        qrStream = stream; qrVideoEl.srcObject = stream;
        qrVideoEl.setAttribute("playsinline","true"); qrVideoEl.muted = true;
        await qrVideoEl.play();
        isScanning = true; beginFrameWatch(); requestAnimationFrame(tick);
        cameraGate.style.display = "none";
      } catch(err) { showCameraGate(); } finally { qrStarting = false; }
    }

    function stopQrCamera(stopWatch = true) {
      if (stopWatch) stopFrameWatch();
      try { if (qrStream) qrStream.getTracks().forEach(t => { try { t.stop(); } catch(e){} }); } catch(e) {}
      qrStream = null;
      try { qrVideoEl.pause(); } catch(e) {}
      try { qrVideoEl.srcObject = null; } catch(e) {}
    }

    function showCameraGate() { cameraGate.style.display = "flex"; }

    cameraGateBtn.addEventListener("touchend", function(e) {
      e.preventDefault(); e.stopPropagation();
      cameraGate.style.display = "none"; qrStarting = false; startQrCamera("gate-touchend");
    }, { passive:false });
    cameraGateBtn.addEventListener("click", function(e) {
      if (cameraGate.style.display === "none") return;
      e.preventDefault(); cameraGate.style.display = "none"; qrStarting = false; startQrCamera("gate-click");
    });

    function beginFrameWatch() {
      stopFrameWatch(); lastFrameAt = Date.now();
      frameWatchTimer = setInterval(() => {
        if (!isScanning) return;
        if (Date.now() - lastFrameAt > 3000) { stopQrCamera(); showCameraGate(); }
      }, 1000);
    }
    function stopFrameWatch() { if (frameWatchTimer) { clearInterval(frameWatchTimer); frameWatchTimer = null; } }

    function tick() {
      try {
        if (!isScanning) { requestAnimationFrame(tick); return; }
        if (qrVideoEl.readyState === qrVideoEl.HAVE_ENOUGH_DATA) {
          const vw = qrVideoEl.videoWidth, vh = qrVideoEl.videoHeight;
          if (vw > 0 && vh > 0) {
            canvas.width = vw; canvas.height = vh;
            ctx.drawImage(qrVideoEl, 0, 0, vw, vh);
            lastFrameAt = Date.now();
            const imageData = ctx.getImageData(0, 0, vw, vh);
            const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts:"dontInvert" });
            if (code && code.data && code.data.trim()) {
              const payload = code.data.trim();
              const now = Date.now();
              if (now - lastScanAt < SCAN_COOLDOWN_MS) { requestAnimationFrame(tick); return; }
              lastScanAt = now;
              if (payload === lastPayload) { requestAnimationFrame(tick); return; }
              lastPayload = payload;
              isScanning = false;
              statusMsg.textContent = "QR読み取り完了！";
              stopQrCamera();
              goToScanner(payload);
            }
          }
        }
      } catch(e) { console.warn("tick error", e); }
      requestAnimationFrame(tick);
    }

    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { qrStarting = false; startQrCamera("visibilitychange"); } });
    window.addEventListener("pageshow", () => { qrStarting = false; startQrCamera("pageshow"); });
    window.addEventListener("pagehide", () => { stopQrCamera(); });

    (async function boot() { await startQrCamera("boot"); })();
  </script>
</body>
</html>
